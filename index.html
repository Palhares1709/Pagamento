<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagamento Pix - Palhares</title>
    <style>
        /* Reset Geral */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: #121212;
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }

        .container { 
            text-align: center; 
            width: 100%; 
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Garante centralização horizontal de todos os filhos */
            animation: slideUp 0.6s ease-out;
        }

        /* Alinhamento da Logo */
        .pix-header-logo {
            width: 80px;
            margin-bottom: 12px;
            filter: brightness(1.2);
            display: block; /* Garante que a logo se comporte como bloco para centralizar */
        }

        /* Correção Definitiva da Badge: Centralização Forçada */
        .pix-badge-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .pix-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }

        /* Estilo do Card Principal */
        .card-main {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { font-size: 22px; margin: 0 0 20px; font-weight: 700; color: white; }

        input {
            width: 100%; 
            padding: 18px; 
            border-radius: 16px; 
            border: 1px solid #333; 
            background: #1a1a1a; 
            color: white; 
            margin-bottom: 20px; 
            outline: none; 
            font-size: 16px;
            text-align: center;
            transition: 0.3s;
        }

        input:focus { border-color: #64D2C1; }

        .welcome-msg { font-size: 18px; margin-bottom: 15px; font-weight: 300; }
        .welcome-msg b { color: #64D2C1; font-weight: 700; }
        
        .qr-wrapper {
            background: white;
            padding: 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .qr-code { width: 160px; height: 160px; display: block; }
        
        .recebedor-label { font-size: 11px; color: #666; letter-spacing: 2px; margin-bottom: 4px; }
        .recebedor-nome { font-size: 16px; font-weight: 700; color: #64D2C1; margin-bottom: 0; }

        .btn-action { 
            background: #64D2C1; 
            color: #121212; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 800; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: 0.2s;
            box-shadow: 0 8px 16px rgba(100, 210, 193, 0.15);
        }
        
        .btn-action:active { transform: scale(0.97); }
        .btn-success { background: #4CAF50 !important; color: white !important; }

        .footer { margin-top: 30px; font-size: 9px; color: #333; letter-spacing: 2px; font-weight: 900; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://logospng.org/download/pix/logo-pix-1024.png" alt="Logo Pix" class="pix-header-logo">
    
    <div class="pix-badge-wrapper">
        <div class="pix-badge">Pagamento Instantâneo</div>
    </div>

    <!-- Interface Gerador -->
    <div id="setup" class="hidden" style="width: 100%;">
        <div class="card-main">
            <h2>Gerar Link</h2>
            <input type="text" id="nameInput" placeholder="Nome do Cliente">
            <button class="btn-action" onclick="createLink()">Copiar e Visualizar Link</button>
        </div>
    </div>

    <!-- Interface Pagamento -->
    <div id="payment" class="hidden" style="width: 100%;">
        <div class="welcome-msg" id="hi">Olá!</div>
        <div class="card-main">
            <div class="qr-wrapper">
                <img src="" alt="QR Code" class="qr-code" id="qr">
            </div>
            <div class="recebedor-label">Recebedor</div>
            <div class="recebedor-nome">PALHARES</div>
        </div>
        <p style="color: #666; font-size: 13px; margin: 20px 0 15px;">Clique abaixo para copiar o código:</p>
        <button class="btn-action" id="copyBtn" onclick="copyPix()">Copiar Código Pix</button>
    </div>

    <div class="footer">POWERED BY PALHARES</div>
</div>

<script>
    const pixCode = "00020126540014br.gov.bcb.pix0121fcpalharess@gmail.com0207Recarga520400005303986540530.005802BR5925FRANCISCO_DE_ASSIS_ROCHA_6007MOSSORO62290525bASV8vlwNpxUzAv6KHaRJ1CSl63047D1F";
    const params = new URLSearchParams(window.location.search);
    const user = params.get('nome');

    if (user) {
        document.getElementById('payment').classList.remove('hidden');
        document.getElementById('hi').innerHTML = `Olá, <b>${user}</b>!`;
        document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(pixCode)}`;
    } else {
        document.getElementById('setup').classList.remove('hidden');
    }

    function createLink() {
        const n = document.getElementById('nameInput').value;
        if(!n) return alert("Por favor, digite o nome do cliente.");
        const link = window.location.origin + window.location.pathname + "?nome=" + encodeURIComponent(n);
        navigator.clipboard.writeText(link);
        alert("Link gerado e copiado! Agora você pode enviá-lo.");
        window.location.href = link;
    }

    function copyPix() {
        navigator.clipboard.writeText(pixCode).then(() => {
            const b = document.getElementById('copyBtn');
            b.innerText = "✓ CÓDIGO COPIADO";
            b.classList.add('btn-success');
            setTimeout(() => {
                b.innerText = "Copiar Código Pix";
                b.classList.remove('btn-success');
            }, 2500);
        });
    }
</script>

</body>
</html>
