<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagamento Pix - Palhares</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes itchyHand {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg) translateX(-3px); }
            75% { transform: rotate(8deg) translateX(3px); }
        }

        html, body { 
            overflow-x: hidden; 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            background: #121212;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px;
        }

        .container { 
            text-align: center; 
            width: 100%; 
            max-width: 350px; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            animation: slideUp 0.6s ease-out;
        }

        /* Logo Pix em Base64 - Inquebrável */
        .pix-header-logo { 
            width: 85px; 
            height: auto;
            margin-bottom: 15px; 
            filter: brightness(1.1);
        }

        .pix-badge-wrapper { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            margin-bottom: 15px; 
        }

        .pix-badge {
            background: rgba(255, 255, 255, 0.07);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .avatar-container {
            font-size: 45px;
            margin-bottom: -8px;
            display: inline-block;
            animation: itchyHand 0.4s infinite;
            filter: drop-shadow(0 0 8px rgba(100, 210, 193, 0.4));
            z-index: 2;
        }

        .card-main {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { font-size: 20px; margin: 0 0 15px; font-weight: 700; }

        input {
            width: 100%; padding: 16px; border-radius: 14px; border: 1px solid #333; 
            background: #1a1a1a; color: white; margin-bottom: 15px; outline: none; 
            font-size: 16px; text-align: center;
        }

        .qr-wrapper {
            background: white;
            padding: 10px;
            border-radius: 18px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-code { width: 155px; height: 155px; display: block; }
        
        .recebedor-label { font-size: 10px; color: #666; letter-spacing: 2px; margin-bottom: 2px; }
        .recebedor-nome { font-size: 16px; font-weight: 700; color: #64D2C1; margin: 0; }

        .btn-action { 
            background: #64D2C1; color: #121212; border: none; padding: 17px; 
            width: 100%; font-size: 15px; font-weight: 800; border-radius: 14px; 
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 12px rgba(100, 210, 193, 0.15);
        }
        
        .btn-action:active { transform: scale(0.97); }
        .btn-success { background: #4CAF50 !important; color: white !important; }

        .footer { margin-top: 25px; font-size: 9px; color: #444; letter-spacing: 2px; font-weight: 900; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Imagem em Base64 para garantir o carregamento em qualquer dispositivo -->
    <img class="pix-header-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAABMCAMAAAB986v8AAAASFBMVEUAAABk0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v9k0v8q9I4XAAAAF3RSTlMAER8vT2RofX6SnaCis7vEyszS2N3p7O/8/T9zAAAAAWJLR0QAiAUdSAAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB+YFExAnIitS/YkAAAL6SURBVGje7ZjbbuMgEIYpS9pUbVpXbd9/0S0X7W6Sps0pL8As/v8vW8Y2YDAIOMfNf4pAnMcXf+AfAwCAv+I7oR8+gP83vGZf8Vp9xev0X9K1XpEAsH5fQW680m68st90I9dYIICf9RUmxmvvxmv9TZf8rO8IsL/BvRuvvRuv9TfdrP0N/hAAYX6DPzdeBzdew990Kz9v8Id7XvD7xqv3er7e6/l6r+frvZ6v93q+Xh3M66v3pWf+K8Y9R+456p6j7jn6nqP9X49uOfatx+v7f0vEa60X8VrrRbzWep3m9X2e19d5fX/v9f2+1/f6Xt/re32v7/V93O/8SInI/Ufdf9QDRz1w9APH7099v7r5mPrO8fU9f60uPqa+N7z7vP8P6u7z4X/Ud9+n88969/l0+6ZfLz/m6/fNf7X+uPmvX78f/7vX9/vxfzT9sfY/2v5Y98f6v9b/fvx/vL7Xf0v0H5N8TPonS9+O/9FrvU4v9Dq98FrvV7vH1F9f89vV7DHzl9vMv20yX675Y738mH65vX6tt7fXm8xr7eXm8pp6id6pW+9UrVdqNpqN6E6pPqHe9OnE09XnU6+un8+9unE+9frC+dzrq8vnc6+vnq9vP68fP69/v67vP69/v24fr3++bh+v/97699fvG/xL/v0Gf+Vf/8P/+id/5v/9mX/65//zn/+dfv/7v6vfu/5V/Z36Xf6T/jR/mH9v/1p/pT/PH6v+Un+s+kO9f70Oun699rt+vY65fr3OOn69jjv9un/6df/06/6p1+lTr9Pn69Pn69Pnx9Pnx9Pn69Pn6+vPr68vH68vH68vH68vH+8vH+8vH+8vH+8vH89vHs9vHs9vHs/vHs/vHs/vHs/vHs/fHs/fHs/fHs/fHs/fH8/fH8/fH8/fH8/fH8/fH8/fH8/fH8/fH8/fH8/vH89vHs9vHs9vHs9vHs9vHs/vHs/vHs/vHs/vH9//vj8AgB/mG/M/yXqH3oVDAAAAJXRFWHRkYXRlOmNyZWF0ZQAyMDIyLTA1LTE5VDE2OjM5OjM0KzAwOjAw967X3AAAACV0RVh0ZGF0ZTptb2RpZnkAMjAyMi0wNS0xOVQxNjozOTozNCswMDowMPBvN5YAAAAASUVORK5CYII=" alt="Logo Pix">
    
    <div class="pix-badge-wrapper">
        <div class="pix-badge">Pagamento Instantâneo</div>
    </div>

    <!-- Interface Gerador -->
    <div id="setup" class="hidden" style="width: 100%;">
        <div class="card-main">
            <h2>Gerar Link</h2>
            <input type="text" id="nameInput" placeholder="Nome do Cliente">
            <button class="btn-action" onclick="createLink()">Copiar Link</button>
        </div>
    </div>

    <!-- Interface Pagamento -->
    <div id="payment" class="hidden" style="width: 100%;">
        <div class="welcome-msg" id="hi" style="font-size: 17px; margin-bottom: 12px;">Olá!</div>
        
        <div class="avatar-container">🤑</div>
        
        <div class="card-main">
            <div class="qr-wrapper">
                <img src="" alt="QR Code" class="qr-code" id="qr">
            </div>
            <div class="recebedor-label">Recebedor</div>
            <div class="recebedor-nome">PALHARES</div>
        </div>
        <p style="color: #666; font-size: 12px; margin: 15px 0 10px;">Clique abaixo para copiar o código:</p>
        <button class="btn-action" id="copyBtn" onclick="copyPix()">Copiar Código Pix</button>
    </div>

    <div class="footer">POWERED BY PALHARES</div>
</div>

<script>
    const pixCode = "00020126540014br.gov.bcb.pix0121fcpalharess@gmail.com0207Recarga520400005303986540530.005802BR5925FRANCISCO_DE_ASSIS_ROCHA_6007MOSSORO62290525bASV8vlwNpxUzAv6KHaRJ1CSl63047D1F";
    const params = new URLSearchParams(window.location.search);
    const user = params.get('nome');

    if (user) {
        document.getElementById('payment').classList.remove('hidden');
        document.getElementById('hi').innerHTML = `Olá, <b>${user}</b>!`;
        document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(pixCode)}`;
    } else {
        document.getElementById('setup').classList.remove('hidden');
    }

    function createLink() {
        const n = document.getElementById('nameInput').value;
        if(!n) return alert("Digite o nome");
        const link = window.location.origin + window.location.pathname + "?nome=" + encodeURIComponent(n);
        navigator.clipboard.writeText(link);
        alert("Link gerado e copiado para " + n);
        window.location.href = link;
    }

    function copyPix() {
        navigator.clipboard.writeText(pixCode).then(() => {
            const b = document.getElementById('copyBtn');
            b.innerText = "✓ CÓDIGO COPIADO";
            b.classList.add('btn-success');
            setTimeout(() => {
                b.innerText = "Copiar Código Pix";
                b.classList.remove('btn-success');
            }, 2500);
        });
    }
</script>

</body>
</html>
