<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagamento Pix - Locapp</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes moneyPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        html, body { 
            overflow-x: hidden; 
            overflow-y: auto; 
            width: 100%; 
            min-height: 100%; 
            margin: 0; 
            background: #121212; 
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 40px 15px; 
        }

        .container { 
            text-align: center; 
            width: 100%; 
            max-width: 350px; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            animation: slideUp 0.6s ease-out;
        }

        .pix-logo-svg { 
            width: 75px; 
            height: auto; 
            margin-bottom: 12px; 
            display: block;
            overflow: visible;
        }

        .pix-badge {
            background: rgba(255, 255, 255, 0.07);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 9px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        #timer-display {
            display: none; 
            background: rgba(100, 210, 193, 0.1);
            color: #64D2C1;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 15px;
            border: 1px solid rgba(100, 210, 193, 0.3);
        }

        .avatar-money {
            font-size: 48px;
            margin-bottom: -10px;
            display: inline-block;
            animation: moneyPulse 1.5s infinite ease-in-out;
            z-index: 10;
        }

        .card-main {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-wrapper {
            background: white;
            padding: 10px;
            border-radius: 18px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-code { width: 160px; height: 160px; display: block; }
        .recebedor-label { font-size: 10px; color: #666; letter-spacing: 2px; margin-bottom: 2px; }
        .recebedor-nome { font-size: 18px; font-weight: 700; color: #64D2C1; margin: 0; }

        .btn-action { 
            background: #64D2C1; color: #121212; border: none; padding: 18px; 
            width: 100%; font-size: 16px; font-weight: 800; border-radius: 16px; 
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 12px rgba(100, 210, 193, 0.15);
            margin-top: 20px;
        }
        
        .btn-action:active { transform: scale(0.97); }
        .btn-success { background: #4CAF50 !important; color: white !important; }

        #expired-msg {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        .footer { margin-top: 40px; font-size: 9px; color: #333; letter-spacing: 2px; font-weight: 900; }
        .hidden { display: none; }
        
        input {
            width: 100%; padding: 18px; border-radius: 16px; border: 1px solid #333; 
            background: #1a1a1a; color: white; margin-bottom: 15px; outline: none; 
            font-size: 16px; text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <!-- SVG com fonte interna reduzida e margem de segurança extra -->
    <svg class="pix-logo-svg" viewBox="-20 -5 170 60" xmlns="http://www.w3.org/2000/svg">
        <g transform="scale(0.9) translate(5, 2)">
            <path d="M51.111 25.101c0 5.672-4.103 10.316-10.457 10.316h-5.94V14.786h5.94c6.354 0 10.457 4.644 10.457 10.315zm-4.322 0c0-3.327-2.181-6.143-6.135-6.143h-1.616v12.286h1.616c3.954 0 6.135-2.816 6.135-6.143zM60.672 35.417V14.786h4.316v20.631h-4.316zM77.92 25.101l7.857 10.316h-5.263l-5.114-7.07-5.114 7.07h-5.263l7.857-10.316-7.55-9.845h5.263l4.801 6.551 4.802-6.551h5.263l-7.551 9.845z" fill="#FFF"/>
        </g>
        <path d="M16.31 32.723l7.001-7.001a1.29 1.29 0 000-1.824l-7.001-7.002a1.29 1.29 0 00-1.824 0l-7.002 7.002a1.29 1.29 0 000 1.824l7.002 7.001a1.29 1.29 0 001.824 0z" fill="#64D2C1"/>
        <path d="M25.753 23.9a10.342 10.342 0 01-3.03 7.311l-7.001 7.001a1.29 1.29 0 01-1.824 0l-7.002-7.001a10.344 10.344 0 010-14.622l7.002-7.002a1.29 1.29 0 011.824 0l7.001 7.002c1.954 1.954 3.03 4.552 3.03 7.31z" stroke="#64D2C1" stroke-width="2.5" fill="none"/>
    </svg>
    
    <div class="pix-badge">Pagamento Instantâneo</div>

    <div id="setup" class="hidden" style="width: 100%;">
        <div class="card-main">
            <h2 style="margin: 0 0 15px; font-size: 20px;">Gerar Link</h2>
            <input type="text" id="nameInput" placeholder="Nome do Cliente">
            <button class="btn-action" onclick="createLink()">Criar Link Personalizado</button>
        </div>
    </div>

    <div id="payment" class="hidden" style="width: 100%;">
        <div id="hi" style="font-size: 18px; margin-bottom: 12px;">Olá!</div>
        
        <div id="timer-display">link expira em: <span id="countdown">05:00</span></div>
        
        <div class="avatar-money">🤑</div>
        <div class="card-main">
            <div class="qr-wrapper">
                <img src="" alt="QR Code" class="qr-code" id="qr">
            </div>
            <div class="recebedor-label">Recebedor</div>
            <div class="recebedor-nome">PALHARES</div>
        </div>
        
        <button class="btn-action" id="copyBtn" onclick="copyPix()">Copiar Código Pix</button>
    </div>

    <div id="expired-msg">
        <div style="font-size: 50px;">✅</div>
        <h2 style="color: #64D2C1;">O link expirou</h2>
        <p style="color: #888; font-size: 14px;">Este link expirou por segurança.</p>
    </div>

    <div class="footer" id="main-footer">POWERED BY PALHARES</div>
</div>

<script>
    const pixCode = "00020126500014br.gov.bcb.pix0121fcpalharess@gmail.com0203Pix5204000053039865802BR5925FRANCISCO_DE_ASSIS_ROCHA_6007MOSSORO62290525ZAXJ6ukiPurdAsbnZKXHDzgEu6304C490";
    const params = new URLSearchParams(window.location.search);
    const user = params.get('nome');
    
    const dateKey = new Date().toLocaleDateString('pt-BR').split('/').join('');
    const storageKey = 'locapp_deadline_' + btoa(user) + '_' + dateKey; 

    if (user) {
        document.getElementById('payment').classList.remove('hidden');
        document.getElementById('hi').innerHTML = `Olá, <b>${user}</b>!`;
        document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(pixCode)}`;
        
        const savedDeadline = localStorage.getItem(storageKey);
        if (savedDeadline) {
            startExpirationLogic(parseInt(savedDeadline));
        }
    } else {
        document.getElementById('setup').classList.remove('hidden');
    }

    function startExpirationLogic(deadline) {
        const timerDisplay = document.getElementById('timer-display');
        timerDisplay.style.display = 'inline-block';

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = deadline - now;

            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = 
                (minutes < 10 ? "0" + minutes : minutes) + ":" + 
                (seconds < 10 ? "0" + seconds : seconds);

            if (distance < 60000) {
                timerDisplay.style.color = "#ff4d4d";
                timerDisplay.style.borderColor = "rgba(255, 77, 77, 0.3)";
            }

            if (distance < 0) {
                clearInterval(x);
                document.getElementById('payment').style.display = 'none';
                document.getElementById('expired-msg').style.display = 'flex';
                document.getElementById('main-footer').style.display = 'none';
            }
        }, 1000);
    }

    function createLink() {
        const n = document.getElementById('nameInput').value;
        if(!n) return alert("Digite o nome do cliente.");
        const link = window.location.origin + window.location.pathname + "?nome=" + encodeURIComponent(n);
        navigator.clipboard.writeText(link).then(() => {
            alert("Link gerado e copiado!");
            window.location.href = link;
        });
    }

    function copyPix() {
        navigator.clipboard.writeText(pixCode).then(() => {
            const b = document.getElementById('copyBtn');
            b.innerText = "✓ CÓDIGO COPIADO";
            b.classList.add('btn-success');
            
            if (!localStorage.getItem(storageKey)) {
                const deadline = new Date().getTime() + (5 * 60 * 1000);
                localStorage.setItem(storageKey, deadline);
                startExpirationLogic(deadline);
            }
        });
    }
</script>
</body>
</html>
