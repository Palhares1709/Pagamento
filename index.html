<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagamento Pix - Palhares</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animação: Dinheiro "esfolheando" (subindo e sumindo em sequência) */
        @keyframes moneyFlip {
            0% { transform: translateY(10px) opacity(0); }
            50% { transform: translateY(0) opacity(1); }
            100% { transform: translateY(-20px) opacity(0); }
        }

        html, body { 
            overflow-x: hidden; 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            background: #121212; 
        }

        body { 
            font-family: 'Inter', sans-serif; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        .container { 
            text-align: center; 
            width: 100%; 
            max-width: 350px; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            animation: slideUp 0.6s ease-out;
        }

        /* LOGO PIX EM SVG PURO - Integrado ao código para não sumir */
        .pix-logo-svg {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
        }

        .pix-badge {
            background: rgba(255, 255, 255, 0.07);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* Bonequinho esfolheando dinheiro */
        .money-box {
            height: 60px;
            position: relative;
            margin-bottom: -5px;
            z-index: 5;
        }

        .bill {
            font-size: 40px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            animation: moneyFlip 1s infinite;
        }
        .bill:nth-child(2) { animation-delay: 0.3s; }
        .bill:nth-child(3) { animation-delay: 0.6s; }

        .card-main {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-wrapper {
            background: white;
            padding: 10px;
            border-radius: 18px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-code { width: 160px; height: 160px; display: block; }
        
        .recebedor-label { font-size: 10px; color: #666; letter-spacing: 2px; margin-bottom: 2px; }
        .recebedor-nome { font-size: 18px; font-weight: 700; color: #64D2C1; margin: 0; }

        .btn-action { 
            background: #64D2C1; color: #121212; border: none; padding: 18px; 
            width: 100%; font-size: 16px; font-weight: 800; border-radius: 16px; 
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 12px rgba(100, 210, 193, 0.15);
            margin-top: 20px;
        }
        
        .btn-action:active { transform: scale(0.97); }
        .btn-success { background: #4CAF50 !important; color: white !important; }

        .footer { 
            margin-top: 30px; 
            font-size: 10px; 
            color: #444; 
            letter-spacing: 2px; 
            font-weight: 900; 
        }

        .hidden { display: none; }
        
        input {
            width: 100%; padding: 18px; border-radius: 16px; border: 1px solid #333; 
            background: #1a1a1a; color: white; margin-bottom: 15px; outline: none; 
            font-size: 16px; text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SVG do Pix embutido (Inquebrável) -->
    <svg class="pix-logo-svg" viewBox="0 0 512 178" xmlns="http://www.w3.org/2000/svg">
        <path d="M124.7 93c0 24.6-17.8 44.8-45.4 44.8H50.9V48.1h28.4c27.6 0 45.4 20.2 45.4 44.9zm-18.8 0c0-14.4-9.5-26.7-26.6-26.7H71v53.4h8.3c17.1 0 26.6-12.3 26.6-26.7zM157.5 137.8V48.1h18.7v89.7h-18.7zM232.4 93l34.1 44.8h-22.8l-22.2-30.7-22.2 30.7h-22.8l34.1-44.8-32.8-42.7h22.8l20.9 28.5 20.9-28.5h22.8L232.4 93z" fill="#FFF"/>
        <path d="M70.8 126.1l30.4-30.4c1.3-1.3 1.3-3.4 0-4.7l-30.4-30.4c-1.3-1.3-3.4-1.3-4.7 0L35.7 91c-1.3 1.3-1.3 3.4 0 4.7l30.4 30.4c1.3 1.3 3.4 1.3 4.7 0z" fill="#64D2C1"/>
    </svg>
    
    <div class="pix-badge">Pagamento Instantâneo</div>

    <!-- Gerador -->
    <div id="setup" class="hidden" style="width: 100%;">
        <div class="card-main">
            <h2 style="margin: 0 0 15px; font-size: 20px;">Gerar Link</h2>
            <input type="text" id="nameInput" placeholder="Nome do Cliente">
            <button class="btn-action" onclick="createLink()">Copiar Link Personalizado</button>
        </div>
    </div>

    <!-- Pagamento -->
    <div id="payment" class="hidden" style="width: 100%;">
        <div id="hi" style="font-size: 18px; margin-bottom: 10px;">Olá!</div>
        
        <!-- Dinheiro "Esfolheando" -->
        <div class="money-box">
            <div class="bill">💸</div>
            <div class="bill">💰</div>
            <div class="bill">💸</div>
        </div>
        
        <div class="card-main">
            <div class="qr-wrapper">
                <img src="" alt="QR Code" class="qr-code" id="qr">
            </div>
            <div class="recebedor-label">Recebedor</div>
            <div class="recebedor-nome">PALHARES</div>
        </div>
        
        <p style="color: #666; font-size: 13px; margin: 15px 0 0;">Toque abaixo para copiar:</p>
        <button class="btn-action" id="copyBtn" onclick="copyPix()">Copiar Código Pix</button>
    </div>

    <div class="footer">POWERED BY PALHARES</div>
</div>

<script>
    const pixCode = "00020126540014br.gov.bcb.pix0121fcpalharess@gmail.com0207Recarga520400005303986540530.005802BR5925FRANCISCO_DE_ASSIS_ROCHA_6007MOSSORO62290525bASV8vlwNpxUzAv6KHaRJ1CSl63047D1F";
    const params = new URLSearchParams(window.location.search);
    const user = params.get('nome');

    if (user) {
        document.getElementById('payment').classList.remove('hidden');
        document.getElementById('hi').innerHTML = `Olá, <b>${user}</b>!`;
        document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(pixCode)}`;
    } else {
        document.getElementById('setup').classList.remove('hidden');
    }

    function createLink() {
        const n = document.getElementById('nameInput').value;
        if(!n) return alert("Digite o nome");
        const link = window.location.origin + window.location.pathname + "?nome=" + encodeURIComponent(n);
        navigator.clipboard.writeText(link);
        alert("Link copiado para " + n);
        window.location.href = link;
    }

    function copyPix() {
        navigator.clipboard.writeText(pixCode).then(() => {
            const b = document.getElementById('copyBtn');
            b.innerText = "✓ COPIADO!";
            b.classList.add('btn-success');
            setTimeout(() => {
                b.innerText = "Copiar Código Pix";
                b.classList.remove('btn-success');
            }, 2500);
        });
    }
</script>

</body>
</html>
