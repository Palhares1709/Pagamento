<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagamento Pix - Locapp</title>
    <style>
        /* Estilos Gerais e Animações */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes moneyPulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        html, body { overflow-x: hidden; overflow-y: auto; width: 100%; min-height: 100%; margin: 0; background: #121212; }
        body { font-family: 'Inter', -apple-system, sans-serif; color: white; display: flex; justify-content: center; align-items: flex-start; padding: 40px 15px; }
        .container { text-align: center; width: 100%; max-width: 350px; display: flex; flex-direction: column; align-items: center; animation: slideUp 0.6s ease-out; }
        .pix-logo-svg { width: 75px; height: auto; margin-bottom: 12px; display: block; }
        .pix-badge { background: rgba(255, 255, 255, 0.07); padding: 4px 12px; border-radius: 20px; font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; }
        
        /* Modais e Caixas de Alerta */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #1e1e1e; border: 1px solid #64D2C1; padding: 25px; border-radius: 24px; width: 90%; max-width: 320px; text-align: center; animation: slideUp 0.3s ease-out; }
        
        /* Elementos das Telas */
        #timer-display { display: none; background: rgba(100, 210, 193, 0.1); color: #64D2C1; padding: 5px 15px; border-radius: 12px; font-size: 14px; font-weight: 800; margin-bottom: 15px; border: 1px solid rgba(100, 210, 193, 0.3); }
        .avatar-money { font-size: 48px; margin-bottom: -10px; display: inline-block; animation: moneyPulse 1.5s infinite ease-in-out; z-index: 10; }
        .card-main { width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 28px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; }
        .qr-wrapper { background: white; padding: 10px; border-radius: 18px; display: inline-block; margin-bottom: 15px; }
        .qr-code { width: 160px; height: 160px; display: block; }
        .recebedor-label { font-size: 10px; color: #666; letter-spacing: 2px; margin-bottom: 2px; }
        .recebedor-nome { font-size: 18px; font-weight: 700; color: #64D2C1; margin: 0; }
        .instituicao-label { font-size: 11px; color: #ffffff; margin-top: 5px; font-weight: 400; letter-spacing: 0.5px; text-align: center; }
        
        /* Botões */
        .btn-action { background: #64D2C1; color: #121212; border: none; padding: 18px; width: 100%; font-size: 16px; font-weight: 800; border-radius: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 12px rgba(100, 210, 193, 0.15); margin-top: 20px; }
        .btn-action:active { transform: scale(0.97); }
        .btn-success { background: #4CAF50 !important; color: white !important; }
        
        /* Caixas de Texto e Seleções */
        #expired-msg { display: none; flex-direction: column; align-items: center; padding: 50px 20px; }
        .footer { margin-top: 40px; font-size: 9px; color: #333; letter-spacing: 2px; font-weight: 900; }
        .hidden { display: none; }
        
        input, select { 
            width: 100%; 
            padding: 18px; 
            border-radius: 16px; 
            border: 1px solid #333; 
            background: #1a1a1a; 
            color: white; 
            margin-bottom: 15px; 
            outline: none; 
            font-size: 16px; 
            text-align: center;
            text-align-last: center; /* Centraliza o texto do dropdown no mobile */
            appearance: none;       /* Remove setas padrão do sistema no select */
        }
        select { cursor: pointer; border-color: rgba(100, 210, 193, 0.2); }
        
        .error-box { color: #ff5252; background: rgba(255,82,82,0.1); border: 1px solid #ff5252; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: none; font-size: 14px; font-weight: 600; }
        .whatsapp-preview-box { background: #142523; border: 1px dashed #64D2C1; padding: 12px; border-radius: 12px; margin-top: 15px; font-size: 12px; color: #ccc; text-align: left; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <div id="modalIcon" style="font-size: 40px; margin-bottom: 10px;">✅</div>
        <h3 id="modalTitle" style="margin: 0 0 10px; color: #64D2C1;">Copiado!</h3>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 10px;" id="modalText"></p>
        <div id="whatsappPreview" class="whatsapp-preview-box hidden"></div>
        <button class="btn-action" style="padding: 12px;" onclick="closeModal()">OK</button>
    </div>
</div>

<div class="container" id="main-content">
    <svg class="pix-logo-svg" viewBox="-20 -5 170 60" xmlns="http://www.w3.org/2000/svg">
        <g transform="scale(0.9) translate(5, 2)">
            <path d="M51.111 25.101c0 5.672-4.103 10.316-10.457 10.316h-5.94V14.786h5.94c6.354 0 10.457 4.644 10.457 10.315zm-4.322 0c0-3.327-2.181-6.143-6.135-6.143h-1.616v12.286h1.616c3.954 0 6.135-2.816 6.135-6.143zM60.672 35.417V14.786h4.316v20.631h-4.316zM77.92 25.101l7.857 10.316h-5.263l-5.114-7.07-5.114 7.07h-5.263l7.857-10.316-7.55-9.845h5.263l4.801 6.551 4.802-6.551h5.263l-7.551 9.845z" fill="#FFF"/>
        </g>
        <path d="M16.31 32.723l7.001-7.001a1.29 1.29 0 000-1.824l-7.001-7.002a1.29 1.29 0 00-1.824 0l-7.002 7.002a1.29 1.29 0 000 1.824l7.002 7.001a1.29 1.29 0 001.824 0z" fill="#64D2C1"/>
        <path d="M25.753 23.9a10.342 10.342 0 01-3.03 7.311l-7.001 7.001a1.29 1.29 0 01-1.824 0l-7.002-7.001a10.344 10.344 0 010-14.622l7.002-7.002a1.29 1.29 0 011.824 0l7.001 7.002c1.954 1.954 3.03 4.552 3.03 7.31z" stroke="#64D2C1" stroke-width="2.5" fill="none"/>
    </svg>
    
    <div class="pix-badge">Pagamento Instantâneo</div>

    <div id="setup" class="hidden" style="width: 100%;">
        <div class="card-main">
            <h2 style="margin: 0 0 15px; font-size: 20px;">Gerar Link Protegido</h2>
            <input type="text" id="nameInput" placeholder="Nome do Cliente">
            <input type="text" id="valueInput" inputmode="decimal" placeholder="Valor R$ 0,00" oninput="formatarMoeda(this)">
            
            <select id="timeInput">
                <option value="5">⏱️ Expira em 5 Minutos</option>
                <option value="15">⏱️ Expira em 15 Minutos</option>
                <option value="60">⏱️ Expira em 1 Hora</option>
                <option value="1440">⏱️ Expira em 24 Horas</option>
            </select>

            <button class="btn-action" onclick="createLink()">Criar Mensagem WhatsApp</button>
        </div>
    </div>

    <div id="payment" class="hidden" style="width: 100%;">
        <div id="error-display" class="error-box">Aviso: Link inválido ou alterado!</div>
        <div id="payment-content">
            <div id="hi" style="font-size: 18px; margin-bottom: 12px;">Olá!</div>
            <div id="timer-display">link expira em: <span id="countdown">00:00</span></div>
            <div class="avatar-money">🤑</div>
            <div class="card-main">
                <div class="qr-wrapper">
                    <img src="" alt="QR Code" class="qr-code" id="qr">
                </div>
                <div class="recebedor-label">Recebedor</div>
                <div class="recebedor-nome">PALHARES</div>
                <div class="instituicao-label">Instituição: Caixa Econômica Federal</div>
            </div>
            <button class="btn-action" id="copyBtn" onclick="copyPix()">Copiar Código Pix</button>
        </div>
    </div>

    <div id="expired-msg">
        <div style="font-size: 50px;">⏳</div>
        <h2 style="color: #64D2C1;">O link expirou</h2>
        <p style="color: #888; font-size: 14px;">Este link expirou por segurança.</p>
    </div>

    <div class="footer" id="main-footer">POWERED BY PALHARES</div>
</div>

<script>
    // Configurações estáticas do recebedor da conta
    const CHAVE_PIX = "+5584991339061";
    const NOME_RECEBEDOR = "FRANCISCO DE ASSIS ROCHA";
    const CIDADE_RECEBEDOR = "MOSSORO";

    // Captura e descriptografa o parâmetro "p" da URL
    const params = new URLSearchParams(window.location.search);
    const tokenSeguro = params.get('p'); 
    
    let finalPixCode = ""; 
    let clienteNome = "";
    let tempoExpiracaoMinutos = 5; // Padrão de segurança de 5 minutos caso falhe

    if (tokenSeguro) {
        document.getElementById('payment').classList.remove('hidden');
        try {
            // Descompacta as 3 variáveis da URL criptografada (Nome, Valor, Tempo)
            const dadosDecodificados = atob(tokenSeguro).split('|');
            clienteNome = dadosDecodificados[0];
            let valorNumerico = parseFloat(dadosDecodificados[1]) || 0;
            tempoExpiracaoMinutos = parseInt(dadosDecodificados[2]) || 5;

            if(!clienteNome || valorNumerico <= 0) throw new Error("Invalido");

            document.getElementById('hi').innerHTML = `Olá, <b>${clienteNome}</b>!`;
            
            finalPixCode = gerarPix(CHAVE_PIX, valorNumerico, NOME_RECEBEDOR, CIDADE_RECEBEDOR);
            document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(finalPixCode)}`;
            
            // Controle do cronômetro baseado no tempo empacotado no token
            const dateKey = new Date().toLocaleDateString('pt-BR').split('/').join('');
            const storageKey = 'locapp_deadline_' + btoa(clienteNome) + '_' + dateKey; 
            const savedDeadline = localStorage.getItem(storageKey);
            if (savedDeadline) startExpirationLogic(parseInt(savedDeadline), storageKey);

        } catch (e) {
            document.getElementById('payment-content').style.display = 'none';
            document.getElementById('error-display').style.display = 'block';
        }
    } else {
        document.getElementById('setup').classList.remove('hidden');
    }

    // Máscara de digitação de moeda automática regional (vírgula)
    function formatarMoeda(campo) {
        let valor = campo.value.replace(/\D/g, ""); 
        if (valor === "") { campo.value = ""; return; }
        valor = (parseFloat(valor) / 100).toFixed(2); 
        campo.value = valor.replace(".", ","); 
    }

    // Algoritmo oficial de montagem do payload Pix do Banco Central
    function gerarPix(chave, valor, nome, city) {
        let payload = "00020126360014br.gov.bcb.pix0114" + chave + "520400005303986";
        if (valor > 0) {
            const vStr = valor.toFixed(2);
            payload += "54" + vStr.length.toString().padStart(2, '0') + vStr;
        }
        payload += "5802BR";
        payload += "59" + nome.length.toString().padStart(2, '0') + nome;
        payload += "60" + city.length.toString().padStart(2, '0') + city;
        payload += "62070503PIX6304";
        return payload + calcularCRC16(payload);
    }

    function calcularCRC16(str) {
        let crc = 0xFFFF;
        for (let i = 0; i < str.length; i++) {
            crc ^= str.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
                else crc <<= 1;
            }
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    // FUNÇÃO QUE GERA A MENSAGEM INTEGRANDO A ESCOLA DO DROPDOWN
    function createLink() {
        const n = document.getElementById('nameInput').value;
        const vRaw = document.getElementById('valueInput').value;
        const t = document.getElementById('timeInput').value; // Pega o tempo do dropdown
        
        const v = vRaw.replace(".", "").replace(",", "."); 
        if(!n || !v || isNaN(v) || parseFloat(v) <= 0) return showModal("Atenção", "Preencha o nome e um valor válido.", "⚠️");
        
        const valorFormatado = parseFloat(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        
        // Agora unificamos 3 itens no token protegido: Nome, Valor e Tempo escolhido
        const stringUnificada = n + "|" + parseFloat(v).toFixed(2) + "|" + t;
        const tokenSeguroGerado = btoa(stringUnificada);
        
        const urlFinal = "https://pix.apploc.com.br/?p=" + tokenSeguroGerado;
        const mensagemWhatsApp = `Olá! Seu link de pagamento seguro da *Locapp* está pronto. \n\n🔹 *Cliente:* ${n}\n🔹 *Valor:* ${valorFormatado}\n\nClique no link abaixo para abrir a tela e acessar o QR Code:\n👉 ${urlFinal}`;
        
        navigator.clipboard.writeText(mensagemWhatsApp).then(() => {
            showModal("Mensagem Copiada!", "O texto já foi copiado. É só abrir o WhatsApp e colar (Ctrl + V) para enviar ao cliente.", "✅", mensagemWhatsApp);
        });
    }

    // DISPARA O CRONÔMETRO QUANDO O CLIENTE COPIA O CÓDIGO PIX
    function copyPix() {
        navigator.clipboard.writeText(finalPixCode).then(() => {
            const b = document.getElementById('copyBtn');
            b.innerText = "✓ CÓDIGO COPIADO";
            b.classList.add('btn-success');
            
            const dateKey = new Date().toLocaleDateString('pt-BR').split('/').join('');
            const storageKey = 'locapp_deadline_' + btoa(clienteNome) + '_' + dateKey;
            
            if (!localStorage.getItem(storageKey)) {
                // Calcula o prazo final usando a variável dinâmica que veio do dropdown
                const deadline = new Date().getTime() + (tempoExpiracaoMinutos * 60 * 1000);
                localStorage.setItem(storageKey, deadline);
                startExpirationLogic(deadline, storageKey);
            }
        });
    }

    function showModal(title, msg, icon, zapText = false) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalIcon').innerText = icon;
        
        const previewEl = document.getElementById('whatsappPreview');
        if (zapText) {
            previewEl.innerText = zapText;
            previewEl.classList.remove('hidden');
        } else {
            previewEl.classList.add('hidden');
        }
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        document.getElementById('nameInput').value = "";
        document.getElementById('valueInput').value = "";
        document.getElementById('timeInput').value = "5"; // Reseta o select para 5 min
    }

    function startExpirationLogic(deadline, key) {
        const timerDisplay = document.getElementById('timer-display');
        timerDisplay.style.display = 'inline-block';
        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = deadline - now;
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("countdown").innerHTML = (minutes < 10 ? "0" + minutes : minutes) + ":" + (seconds < 10 ? "0" + seconds : seconds);
            if (distance < 0) {
                clearInterval(x);
                document.getElementById('payment').style.display = 'none';
                document.getElementById('expired-msg').style.display = 'flex';
            }
        }, 1000);
    }
</script>
</body>
</html>
