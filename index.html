<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Pix - Palhares</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #121212; padding: 20px; text-align: center; width: 100%; max-width: 400px; }
        .pix-logo { width: 100px; margin-bottom: 20px; filter: brightness(1.2); }
        
        .qr-container { border: 2px dashed #444; border-radius: 15px; padding: 20px; margin-bottom: 20px; background-color: #1a1a1a; }
        .qr-code { width: 160px; height: 160px; background-color: white; padding: 8px; border-radius: 8px; }
        
        .nome-recebedor { 
            display: block;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #64D2C1; 
        }

        h2 { font-size: 22px; margin-bottom: 15px; }
        p { color: #bbb; font-size: 14px; margin-bottom: 20px; }
        .btn-copiar { background-color: #64D2C1; color: #121212; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .btn-copiar:active { transform: scale(0.98); }
        .btn-success { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://logospng.org/download/pix/logo-pix-1024.png" alt="Logo Pix" class="pix-logo">
    
    <h2>Realizar Pagamento</h2>
    
    <div class="qr-container">
        <!-- O ID 'qr-image' permite que o JS atualize a imagem automaticamente -->
        <img src="" alt="QR Code" class="qr-code" id="qr-image">
        
        <span class="nome-recebedor">Recebedor: Palhares</span>
        
        <p style="margin-top: 5px; font-size: 12px; color: #888;">Aponte a câmera para o QR Code</p>
    </div>

    <p>Ou copie o código para o seu banco:</p>
    <button class="btn-copiar" id="btnCopiar" onclick="copiarCodigo()">Copiar Código Pix</button>
</div>

<script>
    const meuPix = "00020126540014br.gov.bcb.pix0121fcpalharess@gmail.com0207Recarga520400005303986540530.005802BR5925FRANCISCO_DE_ASSIS_ROCHA_6007MOSSORO62290525bASV8vlwNpxUzAv6KHaRJ1CSl63047D1F";

    // Gera o QR Code automaticamente ao carregar a página usando o seu código Pix real
    document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(meuPix)}`;

    function copiarCodigo() {
        navigator.clipboard.writeText(meuPix).then(() => {
            const btn = document.getElementById('btnCopiar');
            const originalText = btn.innerText;
            
            btn.innerText = "✓ Código Copiado!";
            btn.classList.add('btn-success');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('btn-success');
            }, 2000);
        });
    }
</script>

</body>
</html>
