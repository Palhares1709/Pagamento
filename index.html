<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagamento Pix - Locapp</title>
    <style>
        * { box-sizing: border-box; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(100, 210, 193, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(100, 210, 193, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(100, 210, 193, 0); }
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: radial-gradient(circle at top right, #1e1e1e, #121212);
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .container { 
            text-align: center; 
            width: 100%; 
            max-width: 400px; 
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Espaço para o SEU Logo */
        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            color: #64D2C1;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .pix-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .welcome-msg { font-size: 20px; margin-bottom: 10px; font-weight: 300; }
        .welcome-msg b { color: #64D2C1; font-weight: 700; }
        
        /* Efeito de Vidro no Card */
        .card { 
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px; 
            padding: 40px 25px; 
            margin-bottom: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .qr-wrapper {
            background: white;
            padding: 15px;
            border-radius: 24px;
            display: inline-block;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .qr-code { width: 180px; height: 180px; display: block; }
        
        .recebedor-label { 
            font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;
        }

        .recebedor-nome { 
            font-size: 18px; font-weight: 700; color: #64D2C1; margin-bottom: 0;
        }

        .btn-action { 
            background: #64D2C1; 
            color: #121212; 
            border: none; 
            padding: 20px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 800; 
            border-radius: 18px; 
            cursor: pointer; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(100, 210, 193, 0.2);
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-action:active { transform: scale(0.95); }
        .btn-success { background: #4CAF50 !important; color: white !important; }

        .footer { margin-top: 40px; font-size: 10px; color: #444; letter-spacing: 3px; font-weight: 900; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Branding -->
    <div class="brand-logo">LOCAPP</div>
    <div class="pix-badge">
        <img src="https://logospng.org/download/pix/logo-pix-1024.png" width="18" style="filter: grayscale(1) brightness(2)">
        Pagamento Instantâneo via Pix
    </div>

    <!-- Interface Dinâmica -->
    <div id="setup" class="hidden">
        <h2 style="font-weight: 800;">Gerar Cobrança</h2>
        <input type="text" id="nameInput" placeholder="Nome do Cliente" 
               style="width:100%; padding:20px; border-radius:18px; border:1px solid #333; background:#1a1a1a; color:white; margin-bottom:20px; outline:none; font-size:16px">
        <button class="btn-action" onclick="createLink()">Criar Link Personalizado</button>
    </div>

    <div id="payment" class="hidden">
        <div class="welcome-msg" id="hi">Olá!</div>
        
        <div class="card">
            <div class="qr-wrapper">
                <img src="" alt="QR Code" class="qr-code" id="qr">
            </div>
            <div class="recebedor-label">Recebedor</div>
            <div class="recebedor-nome">PALHARES</div>
        </div>

        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Toque abaixo para copiar o código:</p>
        <button class="btn-action" id="copyBtn" onclick="copyPix()">Copiar Código Pix</button>
    </div>

    <div class="footer">DEVELOPED BY PALHARES</div>
</div>

<script>
    const pixCode = "00020126540014br.gov.bcb.pix0121fcpalharess@gmail.com0207Recarga520400005303986540530.005802BR5925FRANCISCO_DE_ASSIS_ROCHA_6007MOSSORO62290525bASV8vlwNpxUzAv6KHaRJ1CSl63047D1F";
    const params = new URLSearchParams(window.location.search);
    const user = params.get('nome');

    if (user) {
        document.getElementById('payment').classList.remove('hidden');
        document.getElementById('hi').innerHTML = `Olá, <b>${user}</b>!`;
        document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(pixCode)}`;
    } else {
        document.getElementById('setup').classList.remove('hidden');
    }

    function createLink() {
        const n = document.getElementById('nameInput').value;
        if(!n) return alert("Digite o nome");
        const link = window.location.origin + window.location.pathname + "?nome=" + encodeURIComponent(n);
        navigator.clipboard.writeText(link);
        alert("Link copiado! Envie para " + n);
        window.location.href = link;
    }

    function copyPix() {
        navigator.clipboard.writeText(pixCode).then(() => {
            const b = document.getElementById('copyBtn');
            b.innerText = "✓ PRONTO PARA COLAR";
            b.classList.add('btn-success');
            setTimeout(() => {
                b.innerText = "Copiar Código Pix";
                b.classList.remove('btn-success');
            }, 3000);
        });
    }
</script>

</body>
</html>
