<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagamento Pix - Palhares</title>
    <style>
        * { box-sizing: border-box; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .card { 
            text-align: center; 
            width: 100%; 
            max-width: 420px; 
        }

        .pix-logo { 
            width: 100px; 
            margin-bottom: 20px; 
            filter: brightness(1.2); 
        }

        /* Mensagem de Boas-vindas Personalizada */
        .welcome-msg {
            font-size: 18px;
            margin-bottom: 20px;
            color: #eee;
        }
        
        .welcome-msg span {
            color: #64D2C1;
            font-weight: bold;
        }
        
        .qr-container { 
            border: 2px dashed #333; 
            border-radius: 28px; 
            padding: 35px 20px; 
            margin-bottom: 25px; 
            background-color: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .qr-container:hover {
            border-color: #64D2C1;
        }

        .qr-code { 
            width: 200px; 
            height: 200px; 
            background-color: white; 
            padding: 12px; 
            border-radius: 18px; 
            margin-bottom: 15px;
        }
        
        .nome-recebedor { 
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #64D2C1; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h2 { font-size: 22px; margin: 0 0 10px; font-weight: 600; }
        .instrucao { color: #888; font-size: 14px; margin-bottom: 25px; }

        .btn-copiar { 
            background-color: #64D2C1; 
            color: #121212; 
            border: none; 
            padding: 20px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(100, 210, 193, 0.2);
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-copiar:active { transform: scale(0.96); }
        
        .btn-success { 
            background-color: #4CAF50 !important; 
            color: white !important; 
        }

        .footer {
            margin-top: 40px;
            font-size: 10px;
            color: #444;
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="https://logospng.org/download/pix/logo-pix-1024.png" alt="Logo Pix" class="pix-logo">
    
    <!-- Onde o nome do cliente aparecerá -->
    <div class="welcome-msg" id="msgBoasVindas">Olá!</div>

    <h2>Finalizar Pagamento</h2>
    
    <div class="qr-container">
        <img src="" alt="QR Code" class="qr-code" id="qr-image">
        <span class="nome-recebedor">Recebedor: Palhares</span>
        <p style="margin: 12px 0 0; font-size: 12px; color: #555;">Escaneie o QR Code acima</p>
    </div>

    <p class="instrucao">Ou clique abaixo para copiar o código <strong>Copia e Cola</strong>:</p>
    
    <button class="btn-copiar" id="btnCopiar" onclick="copiarCodigo()">Copiar Código Pix</button>

    <div class="footer">POWERED BY LOCAPP</div>
</div>

<script>
    // 1. Lógica para pegar o nome da URL
    const urlParams = new URLSearchParams(window.location.search);
    const nomeCliente = urlParams.get('nome');
    const msgElemento = document.getElementById('msgBoasVindas');

    if (nomeCliente) {
        msgElemento.innerHTML = `Olá, <span>${nomeCliente}</span>!`;
    } else {
        msgElemento.innerHTML = `Olá!`;
    }

    // 2. Dados do Pix
    const meuPix = "00020126540014br.gov.bcb.pix0121fcpalharess@gmail.com0207Recarga520400005303986540530.005802BR5925FRANCISCO_DE_ASSIS_ROCHA_6007MOSSORO62290525bASV8vlwNpxUzAv6KHaRJ1CSl63047D1F";

    // 3. Gerar QR Code
    const qrImg = document.getElementById('qr-image');
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(meuPix)}`;

    // 4. Função Copiar
    function copiarCodigo() {
        navigator.clipboard.writeText(meuPix).then(() => {
            const btn = document.getElementById('btnCopiar');
            const originalText = btn.innerText;
            
            btn.innerText = "✓ CÓDIGO COPIADO!";
            btn.classList.add('btn-success');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('btn-success');
            }, 2500);
        });
    }
</script>

</body>
</html>
